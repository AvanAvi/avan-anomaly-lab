<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>V2 hypersonic cruiser</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;

  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(1040px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>.hv {
  --hv-blend: screen;
  --hv-void: #070707;
  --hv-glass: #1a1f24;
  --hv-ok: #6be0a0;
  --hv-heavy: #8a8a8f;
  --hv-thin: #ff8a5a;
  --hv-ring: #ffffff14;
  --hv-hover: #ffffff0a;
}
[data-theme="light"] .hv {
  --hv-blend: normal;
  --hv-void: #4a4a4e;
  --hv-glass: #e4ecf0;
  --hv-ok: #1f8a55;
  --hv-heavy: #8a8a8f;
  --hv-thin: #c2410c;
  --hv-ring: #0000001a;
  --hv-hover: #0000000a;
}
.hv .iso-plate { padding: 48px 20px 44px; overflow: hidden; }
.hv-stage { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: ew-resize; border-radius: 8px; }
.hv-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }
.hv-stage > svg, .hv-stage > canvas { display: block; width: 100%; height: auto; }
.hv-front, .hv-gl { position: absolute; inset: 0; height: 100% !important; pointer-events: none; }
.hv-gl { mix-blend-mode: var(--hv-blend); }
.hv-front { overflow: visible; }
.hv-front .it, .hv-back .it { pointer-events: visiblePainted; }
.hv-void { fill: var(--hv-void); stroke: none; }
.hv-glass .iso-shade, .hv-glass .iso-top { fill: var(--hv-glass) !important; stroke: var(--hv-glass) !important; }
.hv-wave { stroke-width: 1.6; stroke-linecap: round; }
.hv-lamp { fill: var(--hv-heavy); stroke: var(--anatomy-lo); stroke-width: .4; transition: fill .4s; }
.hv-lamp[data-state="ok"] { fill: var(--hv-ok); }
.hv-lamp[data-state="thin"] { fill: var(--hv-thin); }

.hv-stage[data-focus] .it:not([data-on]) { --anatomy-hi: var(--anatomy-mid); --anatomy-mid: var(--anatomy-lo); --anatomy-lit: var(--anatomy-mid); }
.hv-stage[data-focus] .it[data-on] { --anatomy-hi: var(--anatomy-lit); }

.hv-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin: 0 2px 12px; font: 12px/1.4 var(--anatomy-mono); color: var(--anatomy-muted); }
.hv-mach { display: flex; align-items: center; gap: 10px; color: var(--anatomy-strong); }
.hv-mach input { width: min(320px, 52vw); accent-color: var(--anatomy-strong); }
.hv-mach output { min-width: 3.4em; font-variant-numeric: tabular-nums; }
.hv-hint { margin-left: auto; }

.hv-below { margin: 14px 0 0; }
.hv-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--hv-ring); border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px var(--hv-ring); }
.hv-stats > div { background: var(--anatomy-card); padding: 9px 12px; display: flex; flex-direction: column; gap: 2px; }
.hv-stats span { font-size: 11.5px; color: var(--anatomy-muted); }
.hv-stats b { font: 500 14px/1.3 var(--anatomy-mono); color: var(--anatomy-strong); font-variant-numeric: tabular-nums; }
.hv-stats .hv-regime { grid-column: 1 / -1; }
.hv-stats[data-regime="ok"] .hv-regime b { color: var(--hv-ok); }
.hv-stats[data-regime="thin"] .hv-regime b { color: var(--hv-thin); }
.hv-stats[data-regime="heavy"] .hv-regime b { color: var(--hv-heavy); }

.hv-parts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.hv-part { all: unset; cursor: default; font: 12px/1.4 ui-sans-serif, system-ui, sans-serif; color: var(--anatomy-text); padding: 4px 9px; border-radius: 6px; box-shadow: 0 0 0 1px var(--hv-ring); }
.hv-part:hover, .hv-part[data-on], .hv-part:focus-visible { background: var(--hv-hover); color: var(--anatomy-strong); }
.hv-num { font-family: var(--anatomy-mono); color: var(--anatomy-muted); margin-right: 6px; }
@media (max-width: 560px) { .hv-hint { margin-left: 0; } .hv .iso-plate { padding: 44px 8px 14px; } .hv [data-corner="readout"] { display: none; } }

function glslPose(name, prefix = `u${name}`) {

vec3 dirTo${name}(vec3 d){return vec3(dot(d,${prefix}X),dot(d,${prefix}Y),dot(d,${prefix}Z));}

function glCamera(projection) {
  const a = ((projection.azimuth ?? 45) * Math.PI) / 180;
  const e = ((projection.elevation ?? 30) * Math.PI) / 180;
  return {
    origin: [projection.origin[0], projection.origin[1]],
    k: projection.scale * Math.sqrt(1.6),
    cam: [Math.sin(a), Math.cos(a), Math.sin(e), Math.cos(e)],
  };
}

function glLayer({ canvas, fragment, view, camera, uniforms = [], fixed = {}, extensions = [], maxRatio = 1.5, onError = (message) => console.error(message) }) {

  if (!gl) return null;
  const compile = (type, source) => {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return shader;
    onError(gl.getShaderInfoLog(shader));
    return null;

  gl.attachShader(program, vs);
  gl.attachShader(program, fs);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    onError(gl.getProgramInfoLog(program));
    return null;

  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const position = gl.getAttribLocation(program, "p");
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
  const where = {};
  for (const name of ["uCanvas", "uView", "uOrigin", "uK", "uCam", "uTime", ...uniforms, ...Object.keys(fixed)]) where[name] = gl.getUniformLocation(program, name);
  const types = {};
  const active = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (let index = 0; index < active; index++) {
    const info = gl.getActiveUniform(program, index);
    if (info) types[info.name.replace(/\[0\]$/, "")] = info.type;
  }
  let painted = false;
  const fit = () => {
    const box = canvas.getBoundingClientRect();
    const ratio = Math.min(maxRatio, window.devicePixelRatio || 1);
    const width = Math.max(1, Math.round(box.width * ratio));
    const height = Math.max(1, Math.round(box.height * ratio));
    if (canvas.width !== width || canvas.height !== height) {

      canvas.height = height;
    }

    else if (value.length === 2) gl.uniform2f(at, value[0], value[1]);
    else if (value.length === 3) gl.uniform3f(at, value[0], value[1], value[2]);
    else if (value.length === 4) gl.uniform4f(at, value[0], value[1], value[2], value[3]);

    gl,
    extensions: enabled,
    set(values = {}) {

    },
    draw(values = {}, time = 0) {
      fit();

const smooth = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};

const burst = (age, rise, fall) => (age > 0 ? smooth(0, rise, age) * Math.exp(-Math.max(0, age - rise) / fall) : 0);

function settle(state, target, dt, seconds, calm = false) {
  if (calm) {
    state.x = target;
    state.v = 0;
    return false;
  }
  const w = 1 / seconds;
  for (let index = 0; index < 4; index++) {
    const h = dt / 4;
    state.v += (w * w * (target - state.x) - 2 * w * state.v) * h;
    state.x += state.v * h;
  }
  if (Math.abs(target - state.x) < 1e-4 && Math.abs(state.v) < 1e-4) {
    state.x = target;
    state.v = 0;
    return false;
  }
  return true;
}

// every part that moves comes from here. Sources are the paper's own sections.
//
//  Sutton–Graves        q = k √(ρ/Rn) V³          (Eq. sutton-graves, App. M2)
//  thermal stress       σ = αE q δ / (2λ(1−ν))     (Eq. thermal-stress, App. M3)
//  stress-limited δ     δmax = σa 2λ(1−ν) / (αE q)  (Eq. delta-max)
//  layered areal mass   ρa = Σ ρi δi                (App. M6)
//  MHD magnet           E = B²/(2μ0) π r² L          (Eq. mhd-energy, App. M4)
//  Breguet (corrected)  R = V (L/D) Isp ln(mi/mf)   (Eq. breguet, App. M5)

const CRUISE = {
  altitudeKm: 30,
  rho: 0.018, // kg/m³ at 30 km (Sec. 5.2)
  sound: 300, // m/s, so that Mach 30 is the paper's V = 9,000 m/s
  noseR: 0.05, // m (Sec. 4.2)

const SG_K = 1.7415e-4; // Sutton–Graves, SI, Earth (TFAWS)

const ODSW = { alpha: 4.5e-6, E: 400e9, lambda: 120, nu: 0.28, allow: 260e6, yield: 231e6, uts: 285e6, rho: 19300 };
const FLOOR = 0.5e-3; // unsourced manufacturability floor (Table floor-sensitivity)
const NOMINAL_W = 6e-3; // reference thickness where stress does not bind
const LAYERS = {
  cfc: { t: 15e-3, rho: 1700 },
  rafm: { t: 20e-3, rho: 7750 },
};
const VEHICLE = { gross: 50000, wetted: 120, structure: 0.2, systems: 0.05, payload: 0.05, LD: 3.5, Isp: 500 };

const MAGNET = { B: 2, r: 0.5, L: 3, specific: 110e6 / 10058, packaging: 3 };
const magnetEnergy = () => ((MAGNET.B ** 2) / (2 * 4e-7 * Math.PI)) * Math.PI * MAGNET.r ** 2 * MAGNET.L;
const magnetMass = () => (magnetEnergy() / MAGNET.specific) * MAGNET.packaging;

// the band's midpoint (17.5 %) at Mach 30, ramped in from Mach 17 where the
// paper's radiative sweep starts; this reproduces the paper's δmax of 0.51 mm
// at Mach 25 and 0.28 mm at Mach 30.
const radiativeShare = (mach) => 0.175 * Math.min(1, Math.max(0, (mach - 17) / 13));

// Self-consistent share of the 20,000-sample sweep (Sec. 5.3).

function robustness(mach) {
  if (mach <= 21) return 0.99;
  const lo = Math.floor(mach);
  const hi = Math.min(30, lo + 1);
  const t = mach - lo;
  return ROBUST[lo] + (ROBUST[hi] - ROBUST[lo]) * t;
}

function stateAt(mach) {
  const V = mach * CRUISE.sound;
  const qConv = SG_K * Math.sqrt(CRUISE.rho / CRUISE.noseR) * V ** 3;
  const q = qConv * (1 + radiativeShare(mach));
  const { alpha, E, lambda, nu, allow } = ODSW;
  const dMax = (allow * 2 * lambda * (1 - nu)) / (alpha * E * q);
  const binds = dMax < NOMINAL_W;
  const feasible = dMax >= FLOOR;
  const dUsed = binds ? Math.max(dMax, FLOOR) : NOMINAL_W;
  const stress = (alpha * E * q * dUsed) / (2 * lambda * (1 - nu));
  const areal = ODSW.rho * dUsed + LAYERS.cfc.rho * LAYERS.cfc.t + LAYERS.rafm.rho * LAYERS.rafm.t;
  const tpsMass = areal * VEHICLE.wetted;
  const tps = tpsMass / VEHICLE.gross;
  const mhd = magnetMass() / VEHICLE.gross;
  const fixed = VEHICLE.structure + VEHICLE.systems + VEHICLE.payload;
  const propellant = 1 - fixed - tps - mhd;
  const closes = propellant > 0;
  const range = closes && feasible ? V * VEHICLE.LD * VEHICLE.Isp * Math.log(1 / (1 - propellant)) : 0;
  const regime = !closes ? "heavy" : !feasible ? "thin" : "ok";
  const T0 = 226 * (1 + 0.2 * mach * mach);
  return { mach, V, qConv, q, dMax, dUsed, binds, feasible, stress, areal, tpsMass, tps, mhd, fixed, propellant, closes, range, regime, robust: robustness(mach), T0 };
}

// ------------------------------------------------------------ drawing the live parts
function needle(dial, share) {
  const angle = dial.from + dial.sweep * clamp(share, -0.02, 1.02);
  const [x, y] = [dial.x, dial.y];
  return lineOnTop([x - Math.sin(angle) * 3.2, y + Math.cos(angle) * 3.2], [x + Math.sin(angle) * (dial.r - 4), y - Math.cos(angle) * (dial.r - 4)], dial.top + 0.2, P);
}
function knobPointer(share) {
  const angle = Math.PI - (135 * Math.PI) / 180 + ((270 * Math.PI) / 180) * share;
  const [x, y] = D.knob.at;
  return lineOnTop([x, y], [x + Math.sin(angle) * (D.knob.r - 1), y - Math.cos(angle) * (D.knob.r - 1)], D.knob.top, P);
}
let lastPlate = -1;
function drawPlate(thick) {
  const t = Math.round(thick * 100) / 100;
  if (t === lastPlate) return;
  lastPlate = t;
  const z0 = D.zW;
  const h = Math.max(0.12, t);
  el.plate.innerHTML = solidSvg(slabOf(D.plate, z0, h, P, 3, h > 1.2 ? 0.4 : 0), { tone: "hi", lit: true });
  const tip = z0 + h;
  const [x, y] = D.ind.at;
  el.plunger.innerHTML = solidSvg(cylinder(x, y, 2, tip, 1.6, P, 20), { tone: "hi" }) + solidSvg(cylinder(x, y, 1.1, tip + 1.6, D.ind.bridge - tip - 1.6, P, 16), { tone: "hi", crease: "none" });
}

// ------------------------------------------------------------ readouts
const REGIME = {
  heavy: "Not mass-closeable · stress does not bind, 6 mm armour",
  ok: "Self-consistent · stress-limited thin armour",
  thin: "No buildable thickness · δmax under the 0.5 mm floor",
};
let lastText = "";
function report(m) {
  const s = stateAt(m);
  const text = `Mach ${m.toFixed(1)} · ${fmt(s.V / 1000, 2)} km/s · ${s.regime === "ok" ? `${fmt(s.range / 1000)} km` : s.regime === "heavy" ? "no propellant" : "no design"}`;
  if (text !== lastText) {
    lastText = text;
    readout.textContent = text;
    stage.setAttribute("aria-valuenow", m.toFixed(1));
    stage.setAttribute("aria-valuetext", `${text}. ${REGIME[s.regime]}.`);
    statOf.q.textContent = `${fmt(s.q / 1e6, 1)} MW/m²`;
    statOf.d.textContent = s.binds ? `${fmt(s.dMax * 1000, 2)} mm` : `${fmt(s.dMax * 1000, 1)} mm › 6 mm used`;
    const sFloor = (s.q * 0.5e-3 * 4.5e-6 * 400e9) / (2 * 120 * 0.72);
    statOf.s.textContent = `${fmt(sFloor / 1e6)} MPa / 260`;
    statOf.tps.textContent = fmt(s.tps, 3);
    statOf.prop.textContent = fmt(s.propellant, 3);
    statOf.range.textContent = s.regime === "ok" ? `${fmt(s.range / 1000)} km` : "—";
    statOf.regime.textContent = `${REGIME[s.regime]}${s.regime === "ok" ? ` · ${Math.round(s.robust * 100)} % of swept space` : ""}`;
    statsEl.dataset.regime = s.regime;
    sliderOut.textContent = m.toFixed(1);
  }
  return s;
}

function draw(dt, calm) {
  const s = report(mach);
  const sFloor = (s.q * 0.5e-3 * 4.5e-6 * 400e9) / (2 * 120 * 0.72);
  const goals = { q: s.q / 100e6, s: sFloor / 600e6, r: s.regime === "ok" ? s.range / 4000e3 : 0, d: (s.binds ? s.dMax : 6e-3) / 8e-3 };
  for (const key of Object.keys(goals)) shown[key] = calm ? goals[key] : shown[key] + (goals[key] - shown[key]) * (1 - Math.exp(-dt / 0.12));
  el.q.setAttribute("d", needle(D.dials.q, shown.q));
  el.s.setAttribute("d", needle(D.dials.s, shown.s));
  el.r.setAttribute("d", needle(D.dials.r, shown.r));
  el.d.setAttribute("d", needle({ x: D.ind.at[0], y: D.ind.at[1], r: D.ind.r, top: D.ind.top, from: Math.PI, sweep: Math.PI * 1.8 }, shown.d));
  el.knob.setAttribute("d", knobPointer((mach - 8) / 22));
  drawPlate(shown.d * 8 * D.mm);
  if (el.lamp) el.lamp.dataset.state = s.regime;
  return s;
}

  return -1.;
}
vec3 hotInk(float g){
  vec3 a=vec3(.55,.08,.02);
  vec3 b=vec3(1.,.42,.08);
  vec3 c=vec3(1.,.82,.45);
  vec3 d=vec3(1.,.97,.9);
  return g<.33?mix(a,b,g/.33):g<.7?mix(b,c,(g-.33)/.37):mix(c,d,(g-.7)/.3);
}
void main(){
  vec2 vb=viewOf(gl_FragCoord.xy);
  vec3 V=towardViewer();
  vec3 g0=rayOf(vb);
  vec3 o=vec3(0.,g0.y,g0.z-ZA);
  float A=V.y*V.y+V.z*V.z;
  float B=o.y*V.y+o.z*V.z;
  float RB=58.;
  float C=o.y*o.y+o.z*o.z-RB*RB;
  float disc=B*B-A*C;
  if(disc<=0.){gl_FragColor=vec4(0.);return;}
  float sq=sqrt(disc);
  float ta=(-B-sq)/A;
  float tb=(-B+sq)/A;
  float dith=hash12(gl_FragCoord.xy+fract(uTime*.7)*61.);
  // near surface of the body along this ray
  float tn=-1e9;
  float dtc=(tb-ta)/48.;
  float prevIn=0.;
  for(int i=0;i<48;i++){
    float t=tb-(float(i)+.5)*dtc;
    vec3 p=g0+t*V;
    float s=NX-p.x;
    float rho=length(vec2(p.y,p.z-ZA));
    float br=bodyR(s);
    if(br>0.&&rho<br){tn=t;break;}
  }
  if(tn>-1e8){
    float lo=tn;float hi=tn+dtc;
    for(int j=0;j<7;j++){
      float m=(lo+hi)*.5;vec3 p=g0+m*V;float s=NX-p.x;float br=bodyR(s);
      if(br>0.&&length(vec2(p.y,p.z-ZA))<br)lo=m;else hi=m;
    }
    tn=hi;
  }
  float T=uTime;
  vec3 col=vec3(0.);
  float dt=(tb-ta)/32.;
  for(int i=0;i<32;i++){
    float t=ta+(float(i)+dith)*dt;
    vec3 p=g0+t*V;
    float frontW=tn>-1e8?smoothstep(tn-.6,tn+.6,t):0.;
    float w=mix(1.-frontW,frontW,uFront);
    if(tn>-1e8&&t<tn-.6)w=(1.-uFront)*0.;
    float s=NX-p.x;
    float rho=length(vec2(p.y,p.z-ZA));
    // bow shock: a thin conical sheet just outside the body, brightest at the nose
    float rs=1.2+RN*.6+tan(.205)*max(s,0.);
    float sw=.9+.022*max(s,0.);
    float shell=exp(-pow((rho-rs)/sw,2.))*smoothstep(-3.,1.,s)*exp(-max(s,0.)/95.)*(1.-smoothstep(150.,190.,s));
    float layer=exp(-pow(max(rho-bodyR(max(s,0.)),0.)/(1.2+.03*max(s,0.)),2.))*step(0.,bodyR(max(s,0.)))*smoothstep(-2.,0.,s)*exp(-max(s,0.)/28.);
    float flick=.85+.3*noise3(vec3(p.x*.06-T*3.,p.y*.08,p.z*.08));
    vec3 shockC=mix(vec3(.55,.62,1.),vec3(1.,.55,.25),uHeat);
    col+=shockC*shell*dt*.055*uHeat*flick*w;
    col+=hotInk(.35+.6*uHeat)*layer*dt*.22*uHeat*w;
    // nose stagnation halo in the air just ahead of the tip
    float dn=length(p-vec3(NX+RN*.5,0.,ZA));
    col+=hotInk(.5+.5*uHeat)*exp(-pow(dn/(3.+4.*uHeat),2.))*dt*.5*uHeat*w;
    // exhaust: an annular sheet off the shroud lip hugging the plug, then a core to the diffuser
    float sx=s-P0;
    float ann=0.;
    if(s>P0-2.){
      float rp=s<P1?bodyR(s)+2.+ (28.-bodyR(s))*exp(-sx/22.):12.*exp(-(s-P1)/90.)+4.;
      float wid=2.+.05*sx;
      ann=exp(-pow((rho-rp)/wid,2.))*smoothstep(P0-2.,P0+6.,s);
      float core=exp(-pow(rho/(7.+.06*max(s-P1,0.)),2.))*smoothstep(P1-6.,P1+18.,s);
      float swallow=1.-smoothstep(DIFX-NX+18.,DIFX-NX+40.,-s+0.)*0.;
      float mouth=1.-smoothstep(NX-DIFX-40.,NX-DIFX-6.,s);
      float diamonds=.75+.25*cos((s-P1)*.16-T*2.);
      float turb=.8+.4*noise3(vec3(p.x*.04+T*6.,p.y*.07,p.z*.07));
      vec3 ex=vec3(1.,.66,.4);
      col+=ex*(ann*.035+core*.03*diamonds)*dt*uBurn*turb*mouth*w*swallow;
    }
  }
  // the glowing cap itself: where the ray meets the body near the nose (front canvas only)
  if(tn>-1e8&&uFront>.5){
    vec3 p=g0+tn*V;
    float s=NX-p.x;
    float hot=exp(-max(s,0.)/(6.+10.*uHeat));
    col+=hotInk(.25+.75*uHeat*hot)*hot*1.4*uHeat*smoothstep(-1.,.5,s);
  }
  col=tonemap(col,1.2);
  float m=max(col.r,max(col.g,col.b));
  float n=(hash12(gl_FragCoord.xy+fract(uTime*.61)*91.)+hash12(gl_FragCoord.yx*1.37+fract(uTime*.37)*57.)-1.)/255.;
  col=max(col+n*smoothstep(0.,1.5/255.,m),0.);
  m=max(col.r,max(col.g,col.b));
  if(uLight<.5){gl_FragColor=vec4(col,m);return;}
  // paper: write the colour the paper should show, then solve for the ink
  vec3 hue=col/max(m,1e-4);
  vec3 sat=mix(vec3(.92,.38,.08),hue*vec3(.95,.55,.3),.35);
  vec3 seen=mix(vec3(1.),sat,smoothstep(0.,1.2,m)*.8);
  seen=mix(seen,vec3(1.,.93,.78),smoothstep(.8,1.,m)*.5);
  vec3 absorbed=1.-seen;
  float a=max(absorbed.r,max(absorbed.g,absorbed.b));
  gl_FragColor=vec4(vec3(a)-absorbed,a);
}`;
const layers = [stage.querySelector(".hv-gl-back"), stage.querySelector(".hv-gl-front")].map((canvas, index) =>
  glLayer({ canvas, fragment: FRAG, view: [D.W, D.H], camera: D.camera, uniforms: ["uHeat", "uBurn"], fixed: { uFront: index, uLight: LIGHT } }),
);
const gl = layers.every(Boolean);
if (gl) stage.setAttribute("data-gl", "");
let lastGl = "";
function paint(s, calm) {
  if (!gl) return false;
  const heatGoal = Math.pow(clamp(s.q / 90e6, 0, 1), 0.6);
  const burnGoal = s.regime === "ok" ? 1 : 0.25;
  const moving = settle(heat, heatGoal, 1 / 60, 0.35, calm) | settle(burn, burnGoal, 1 / 60, 0.5, calm);
  const values = { uHeat: heat.x, uBurn: burn.x };
  const key = calm ? JSON.stringify(values) : "";
  if (key && key === lastGl) return false;
  lastGl = key;
  const time = calm ? 0.8 : clock;
  for (const layer of layers) layer.draw(values, time);
  return moving;
}

// ------------------------------------------------------------ loop
function tourTarget(t) {
  const period = 22;
  const x = (t % period) / period;
  return 8 + 22 * (0.5 - 0.5 * Math.cos(x * Math.PI * 2));
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  const calm = still.matches;
  if (touring) {
    tourClock += dt;
    target = tourTarget(tourClock + 7.6);
    slider.value = target.toFixed(1);
  }
  mach = calm ? target : mach + (target - mach) * (1 - Math.exp(-dt / 0.22));
  if (Math.abs(target - mach) < 0.002) mach = target;
  const s = draw(dt, calm);
  if (!calm) wavePhase = (wavePhase + dt * (0.7 + 0.5 * burn.x)) % 1;
  if (el.wave) el.wave.setAttribute("d", D.waves[Math.floor(wavePhase * D.waves.length) % D.waves.length]);
  paint(s, calm);
  const busy = touring || mach !== target || !calm;
  frame = visible && busy ? requestAnimationFrame(tick) : 0;
}
function run() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

function steer(next) {
  touring = false;
  target = clamp(next, 8, 30);
  slider.value = target.toFixed(1);
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    touring = !still.matches;
    tourClock = Math.acos(clamp(1 - 2 * ((mach - 8) / 22), -1, 1)) / (Math.PI * 2) * 22 - 7.6;
    run();
  }, 6000);
  run();
}
let dragging = false;
const machAt = (event) => {
  const box = stage.getBoundingClientRect();
  return 8 + 22 * clamp(((event.clientX - box.left) / box.width - 0.12) / 0.76, 0, 1);
};
stage.addEventListener("pointerdown", (event) => {
  dragging = true;
  stage.setPointerCapture(event.pointerId);
  steer(machAt(event));
});
stage.addEventListener("pointermove", (event) => {
  const part = pieceAt(event);
  if (part !== selected && !dragging) select(part);
  if (dragging) steer(machAt(event));
});
stage.addEventListener("pointerup", () => (dragging = false));
stage.addEventListener("pointercancel", () => (dragging = false));
stage.addEventListener("pointerleave", () => select(null));
stage.addEventListener("keydown", (event) => {
  const step = event.shiftKey ? 5 : 1;
  if (event.key === "ArrowRight" || event.key === "ArrowUp") steer(Math.round(target) + step);
  else if (event.key === "ArrowLeft" || event.key === "ArrowDown") steer(Math.round(target) - step);
  else if (event.key === "Home") steer(8);
  else if (event.key === "End") steer(30);
  else return;
  event.preventDefault();
});
slider.addEventListener("input", () => steer(Number(slider.value)));

function pieceAt(event) {
  const hit = document.elementFromPoint(event.clientX, event.clientY);
  const item = hit && hit.closest ? hit.closest(".it") : null;
  const id = item ? item.dataset.piece : null;
  return id && id !== "bench" ? id : null;
}
function select(id) {
  if (selected === id) return;
  selected = id;
  for (const node of stage.querySelectorAll(".it")) node.toggleAttribute("data-on", id !== null && node.dataset.piece === id);
  stage.toggleAttribute("data-focus", !!id);
  partButtons.forEach((button) => button.toggleAttribute("data-on", button.dataset.part === id));
  const hint = root.querySelector(".hv-hint");
  if (hint) hint.textContent = id ? D.pieces[id].say : "Drag across the cell or turn the knob · ← → to step";
}
partButtons.forEach((button) => {
  button.addEventListener("pointerenter", () => select(button.dataset.part));
  button.addEventListener("focus", () => select(button.dataset.part));
  button.addEventListener("pointerleave", () => select(null));
  button.addEventListener("blur", () => select(null));
});
window.addEventListener("resize", () => {
  lastGl = "";
  run();
});
if (still.matches) touring = false;
draw(1, true);
</script></body></html>
